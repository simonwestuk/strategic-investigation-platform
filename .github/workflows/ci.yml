name: CI

# Pull-request / main-branch CI. Requires no repository secrets: everything runs with the offline reasoner,
# the offline search corpus and throwaway service containers.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    env:
      SIP_ENV: test
      LANGGRAPH_STRICT_MSGPACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check src tests evals
      - name: Mypy
        run: mypy
      - name: Pytest
        # Postgres-backed tests run in the python-postgres job.
        run: pytest -q -m "not postgres"

  python-postgres:
    name: Python — Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sip
          POSTGRES_PASSWORD: sip
          POSTGRES_DB: sip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sip -d sip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SIP_ENV: test
      LANGGRAPH_STRICT_MSGPACK: "true"
      DATABASE_URL: postgresql+psycopg://sip:sip@localhost:5432/sip
      VAULT_DATABASE_URL: postgresql+psycopg://sip:sip@localhost:5432/sip_vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Create vault database
        run: psql "postgresql://sip:sip@localhost:5432/sip" -c "CREATE DATABASE sip_vault"
      - name: Apply migrations
        run: sip db upgrade
      - name: Pytest (postgres marker)
        run: |
          set +e
          pytest -q -m postgres
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests marked 'postgres' were collected."
            exit 0
          fi
          exit $code

  evals:
    name: Offline evaluation (Northstar)
    runs-on: ubuntu-latest
    env:
      SIP_ENV: test
      SIP_REASONER: offline
      SIP_SEARCH_PROVIDER: offline_corpus
      LANGGRAPH_STRICT_MSGPACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Run evaluation
        run: sip eval run --scenario northstar --reasoner offline --output evals/reports/ci
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-northstar
          path: evals/reports/ci
          if-no-files-found: warn
          retention-days: 30

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Security — dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: pip-audit (installed environment)
        run: pip-audit --skip-editable --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (high and above)
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for repositories owned by an organisation.

  docker:
    name: Docker — build images (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: sip-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          tags: sip-web:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
