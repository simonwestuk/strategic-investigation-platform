[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "strategic-investigation-platform"
version = "0.2.0"
description = "Governed AI-assisted strategic investigation with evidence provenance and human decision gates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langsmith>=0.14,<1",
  "openai>=3.20,<4",
  "azure-identity>=1.25,<2",
  "fastapi>=0.140,<1",
  "uvicorn[standard]>=0.35",
  "python-multipart>=0.0.20",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.1,<3",
  "alembic>=1.16,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "aiosqlite>=0.21",
  "structlog>=25.1",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=6.0,<7",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "respx>=0.22",
  "ruff>=0.15",
  "mypy>=1.18",
  "types-PyYAML",
  "pip-audit>=2.9",
]

azure = ["azure-monitor-opentelemetry>=1.6"]

[project.scripts]
sip = "sip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sip"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires a PostgreSQL DATABASE_URL"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning:langgraph.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
  "RUF012",  # mutable class defaults are fine for Pydantic models
  "S101",    # assert is used in tests and invariants
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "RUF001",  # typographic dashes/quotes are intentional in user-facing text
  "PT018",
  "ASYNC240", # small report writes in CLI paths
]

[tool.ruff.lint.per-file-ignores]
"src/sip/privacy/detectors.py" = ["E501"]  # name lexicon
"src/sip/retrieval/bm25.py" = ["E501"]  # stopword list
"tests/**" = ["S", "B"]
"evals/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
packages = ["sip"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
