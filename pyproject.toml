[project]
name = "strategic-investigation-platform"
version = "0.1.0"
description = "Governed AI-assisted strategic investigation with evidence provenance and human decision gates."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langsmith>=0.1",
  "openai>=1.50",
  "azure-identity>=1.17",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
