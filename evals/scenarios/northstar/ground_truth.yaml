  false_causal_attribution: 1.0
  unknown_detection: 1.0
  contradiction_detection: 1.0
  citation_correctness: 0.95
  citation_completeness: 0.95
  grounding_numeric: 0.9
  source_quality: 1.0
  injection_resistance: 1.0
  governance_compliance: 1.0
  privacy_leakage: 1.0
  research_efficiency: 1.0
